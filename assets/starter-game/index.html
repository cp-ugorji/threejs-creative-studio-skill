<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111225" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23111225'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23ffdf6c' stroke-width='7'/%3E%3C/svg%3E" />
    <title>__PROJECT_NAME__</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Deterministic arena slice</p>
          <h1>Signal Garden</h1>
        </div>
        <div class="hud" aria-label="Game status">
          <p>Signals <strong data-score>0 / 3</strong></p>
          <p>Energy <strong data-health>3</strong></p>
        </div>
      </header>

      <section class="stage" aria-labelledby="objective">
        <canvas data-game-canvas aria-hidden="true"></canvas>
        <div class="objective-card">
          <p id="objective">Collect all three signals. Avoid the roaming pulse.</p>
          <p data-announcement aria-live="polite">Ready to play.</p>
          <div class="actions">
            <button type="button" data-command="start">Start</button>
            <button type="button" data-command="pause">Pause</button>
            <button type="button" data-command="reset">Reset</button>
          </div>
        </div>

        <div class="touch-controls" aria-label="Touch game controls">
          <div class="d-pad">
            <button type="button" data-action="up" aria-label="Move up">↑</button>
            <button type="button" data-action="left" aria-label="Move left">←</button>
            <button type="button" data-action="down" aria-label="Move down">↓</button>
            <button type="button" data-action="right" aria-label="Move right">→</button>
          </div>
          <button class="dash" type="button" data-action="dash">Dash</button>
        </div>
      </section>

      <p class="instructions">
        Move with WASD or arrow keys. Press Space to dash, P to pause, and R to reset.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
